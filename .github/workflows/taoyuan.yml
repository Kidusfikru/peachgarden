name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Verify build output
        run: |
          if [ ! -d "docs" ]; then
            echo "Build failed: docs directory does not exist"
            exit 1
          fi
          if [ ! -f "docs/index.html" ]; then
            echo "Build failed: docs/index.html does not exist"
            exit 1
          fi

          BUILD_TIME=$(stat -c %Y docs/index.html 2>/dev/null || stat -f %m docs/index.html 2>/dev/null || echo "0")
          CURRENT_TIME=$(date +%s)
          TIME_DIFF=$((CURRENT_TIME - BUILD_TIME))

          echo "Build output information:"
          echo "  Age: ${TIME_DIFF} seconds"

          if [ $TIME_DIFF -gt 300 ]; then
            echo "Warning: build output may be stale (more than 5 minutes old)"
          fi

          echo "Build output verified"
          ls -la docs/

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Prepare CI build environment
        run: |
          cp .dockerignore.ci .dockerignore
          echo "Switched to CI build mode"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Log in to Docker Hub only when a username is configured.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: false
          pull: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taoyuan:latest
            ghcr.io/${{ github.repository_owner }}/taoyuan:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/taoyuan:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME && format('{0}/taoyuan:latest', env.DOCKERHUB_USERNAME) || '' }}
            ${{ env.DOCKERHUB_USERNAME && format('{0}/taoyuan:{1}', env.DOCKERHUB_USERNAME, steps.version.outputs.version) || '' }}
            ${{ env.DOCKERHUB_USERNAME && format('{0}/taoyuan:{1}', env.DOCKERHUB_USERNAME, github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.date }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Taoyuan Township
            org.opencontainers.image.description=Taoyuan Township - text-based farming simulation game
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
